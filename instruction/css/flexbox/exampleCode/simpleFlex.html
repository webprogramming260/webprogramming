<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
</head>

<body>
  <header>
    <h1>CSS flex &amp; media query</h1>
  </header>
  <main>
    <section>
      <h2>Controls</h2>
    </section>
    <section>
      <h2>Content</h2>
    </section>
  </main>
  <footer>
    <h2>Footer</h2>
  </footer>
</body>

<style>
  * {
    text-align: center;
    font-family: sans-serif;
    color: white;
    box-sizing: border-box;
  }

  body {
    margin: 0;
    display: flex;
    flex-direction: column;
    height: 100vh;
  }

  header {
    flex: 0 80px;
    background: hsl(223, 57%, 38%);
  }

  footer {
    flex: 0 30px;
    background: hsl(180, 10%, 10%);
  }

  main {
    flex: 1;
    display: flex;
    flex-direction: row;
  }

  section h2 {
    color: black;
  }

  section:nth-child(1) {
    flex: 1;
    background-color: hsl(180, 10%, 80%);
  }
  section:nth-child(2) {
    flex: 3;
    background-color: white;
  }

  @media (orientation: portrait) {
    main {
      flex-direction: column;
    }
  }

  @media (max-height: 700px) {
    header {
      display: none;
    }
    footer {
      display: none;
    }
  }
</style>
